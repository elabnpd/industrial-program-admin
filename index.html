<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Industrial Program Admin</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Industrial Program — Admin</h1><p id="notice"></p><section id="login"><h2>Sign in</h2><form id="loginForm"><input id="email" type="email" placeholder="Email" required autocomplete="username"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign in</button></form></section><section id="dashboard" hidden><button id="logout">Sign out</button><h2>Upload program</h2><form id="uploadForm"><label>Series<input id="series" type="text" placeholder="e.g. I, M, 5M" maxlength="30" required></label><label>Model<input id="model" type="text" placeholder="e.g. 1W+1S" maxlength="40" required></label><label>Program type<input id="kind" type="text" placeholder="e.g. PLC or HMI" maxlength="30" required></label><label>Version<input id="version" placeholder="1.0.0" pattern="[0-9]+\.[0-9]+\.[0-9]+" required></label><label>Comments<textarea id="comments" required></textarea></label><label>Archive (max 100 MB)<input id="file" type="file" accept=".zip,.rar,.7z,.tar,.tgz,.gz,.bz2,.xz" required></label><button>Stage upload</button></form><h2>Staged uploads</h2><button id="reloadUploads">Refresh uploads</button><div id="uploads"></div><h2>Create employee</h2><form id="userForm"><input id="newEmail" type="email" placeholder="Employee email" required><input id="newPassword" type="password" placeholder="Temporary password (12+ characters)" minlength="12" required><select id="newRole"><option value="viewer">Viewer</option><option value="admin">Admin</option></select><button>Create account</button></form><h2>Change my password</h2><form id="changePasswordForm"><input id="currentPassword" type="password" placeholder="Current password" autocomplete="current-password" required><input id="myNewPassword" type="password" placeholder="New password (12+ characters)" autocomplete="new-password" minlength="12" required><input id="myConfirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" minlength="12" required><button type="submit">Update my password</button></form><h2>Created employees</h2><button id="reloadUsers" type="button">Refresh employees</button><div id="employees" aria-live="polite"></div><h2>Published programs</h2><button id="reloadReleases">Refresh releases</button><div id="releases"></div></section></main><script src="app.js"></script></body></html>
